// Clone of RPM's own shared library model (JSI/RasterPropMonitor/Library/Components/MFD40x20v2) —
// the same base geometry used by RasterPropMonitorBasicMFD (JSI) and MAS_JSI_BasicMFD (MOARdV).
// Reusing the model this way (new PROP name, no mesh duplication) mirrors how BasicMFD/ALCOR
// already do it — see GameData/MFDExtension/notes/NOTES_IVA_MFD_SharedFramework.md, section 8, for why
// this specific model was picked (public RPM library asset, not exclusive to any one mod).
PROP
{
	name = MFDExt_MFD40x20

	MODEL
	{
		model = JSI/RasterPropMonitor/Library/Components/MFD40x20v2/model
		texture = MFD40x15v2-Diffuse,JSI/RasterPropMonitor/Library/Components/MFD40x20v2/MFD40x15v2-Diffuse
		texture = MFD40x15v2-Emissive,JSI/RasterPropMonitor/Library/Components/MFD40x20v2/MFD40x15v2-Emissive
		texture = screen,JSI/RasterPropMonitor/Library/Components/MFD40x20v2/screen
		texture = screen-emissive,JSI/RasterPropMonitor/Library/Components/MFD40x20v2/screen-emissive
	}

	MODULE
	{
		name = RasterPropMonitor
		screenTransform = FlatMon40x10Screen
		fontTransform = JSI/RasterPropMonitor/Library/Fonts/baseFont
		textureLayerID = _Emissive            // Name of texture layer to work with on the screen surface.
		screenWidth = 40                      // Screen width in letters.
		screenHeight = 20                     // Screen height in lines.
		screenPixelWidth = 640                // Width of the generated screen texture in pixels.
		screenPixelHeight = 640               // Height of the generated screen texture in pixels.
		fontLetterWidth = 16                  // Width of a font character.
		fontLetterHeight = 32                 // Height of a font character.
		cameraAspect = 1.0
		fontDefinition = JSI/RasterPropMonitor/Library/Fonts/fontDefinition.txt

		refreshDrawRate = 2
		refreshTextRate = 10
		refreshDataRate = 20

		// Physical collider/button names on this shared model, verified against
		// MOARdV/MAS_JSI/MAS_JSI_BasicMFD.cfg (uses the identical model):
		// button_A..G, buttonR1..R7, button_UP/DOWN/LEFT/RIGHT/ENTER/ESC/HOME,
		// buttonR9, buttonR10, button_STBY (24 total). Only the "menu ring" is
		// wired here as globalButtons; A-G/R1-R7 stay free for host mods to
		// claim in step 3 (button-budget planning).
		globalButtons = button_UP,button_DOWN,button_ENTER,button_ESC,button_HOME,button_RIGHT,button_LEFT,buttonR9,buttonR10

		// Placeholder page only - real per-mod content arrives in step 4.
		PAGE
		{
			name = home
			default = yes
			button = button_STBY
			text = MFDExtension/Props/MFDExt_MFD40x20/page_home.txt
		}
	}
}
