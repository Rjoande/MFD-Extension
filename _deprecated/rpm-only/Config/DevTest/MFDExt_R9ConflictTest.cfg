// TEMPORARY / TEST ONLY - answers one open question before writing the
// first real additive patch: on BasicMFD, buttonR9/buttonR10 are BOTH
// (a) globalButtons, forwarded as click index 7/8 to whichever page's
// handler is currently active (used today by the "map" page, SCANsat,
// and "extcamAll", the external camera page - both read index 7 as
// nextCamera/nextPatch), and (b) completely unused as a PAGE-switch
// button anywhere in this install (grep found zero PAGE bound to
// buttonR9/R10 on this model). Binding a new PAGE to buttonR9 here tells
// us which one wins: does pressing R9 always switch to this test page
// (which would mean our NEXT/PREV entry point could unexpectedly hijack
// R9 away from "map"/"extcamAll" while the player is using them), or does
// the active page's own handler keep control of R9 (safe to use as our
// entry point)? See GameData/MFDExtension/CLAUDE.md log 2026-08-09 (10)/(11).
//
// DELETE after the test confirms the answer (or archive alongside
// _deprecated/ if useful reference later).

@PROP[RasterPropMonitorBasicMFD]:NEEDS[RasterPropMonitor]:Final
{
	@MODULE[RasterPropMonitor]
	{
		PAGE
		{
			name = mfdext_test_r9
			button = buttonR9
			text = MFDExtension/Config/DevTest/r9_test_page.txt
		}
	}
}
