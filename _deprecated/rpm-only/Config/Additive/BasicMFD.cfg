// Additive-branch entry point for BasicMFD (JSI RasterPropMonitorBasicMFD).
// Two entry paths to the same page, deliberately redundant:
//
//   1. R9 shortcut: adds a BACKGROUNDHANDLER (MFDExtStbyBridge, draws
//      nothing, only carries buttonClickMethod) to the EXISTING "home" page
//      (BasicMFD's own default/stby page - verified via `default = yes` in
//      JSI/RPMPodPatches/BasicMFD/MFD40x20.cfg). Catches the click BasicMFD's
//      globalButtons already forward to whichever page is active (index 7 =
//      buttonR9, same channel SCANsat/extcam already use - see CLAUDE.md
//      2026-08-09 for why a PAGE can never bind buttonR9 directly), then
//      jumps via reflection into RPM's private FindPageByName + public
//      PageButtonClick. Silently falls back to doing nothing if RPM's
//      internals ever change shape (see MFDExtStbyBridge.cs).
//
//   2. STBY cycle fallback: adds "stby_MFDExt" as a 4th page bound to
//      button_STBY, alongside BasicMFD's existing home/test/description.
//      Fully public RPM mechanism (SmarterButton.CreateButton on a button
//      that is NOT a globalButton) - always reachable regardless of whether
//      the R9 shortcut still works, at the cost of extra STBY presses.

@PROP[RasterPropMonitorBasicMFD]:NEEDS[RasterPropMonitor]:Final
{
	@MODULE[RasterPropMonitor]
	{
		@PAGE[home]
		{
			BACKGROUNDHANDLER
			{
				name = MFDExtStbyBridge
				method = RenderNothing
				buttonClickMethod = HandleButtonClick
				targetPageName = stby_MFDExt
				triggerButtonIndex = 7
			}
		}
		PAGE
		{
			name = stby_MFDExt
			button = button_STBY
			text = MFDExtension/Pages/stby_MFDExt.txt
		}
	}
}
