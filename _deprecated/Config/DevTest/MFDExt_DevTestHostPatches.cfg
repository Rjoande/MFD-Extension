// --- Synthetic third-party mod scenario: "Nemo" never exists in this
// workspace, so this fallback should ALWAYS show on button_E - proves the
// fallback text mechanism itself actually renders in game, unlike the 4
// blocks above (real mods) which currently cannot show a fallback since
// they ARE installed. ---

@PROP[MFDExt_MFD40x20]:NEEDS[!Nemo]
{
	@MODULE[RasterPropMonitor]
