// Reserves button_A/B/C/D on MFDExt_MFD40x20 as fixed slots for the four
// first-party host mods (contract documented in HOSTING.md). Each block
// below adds a "module not detected" fallback page on the reserved button,
// but ONLY when the corresponding mod's assembly is absent - once the real
// host mod ships its own :NEEDS[<assembly>,MFDExtension] patch adding its own
// PAGE on the same button, this fallback simply won't be added (mutually
// exclusive by NEEDS/NEEDS[!], no coordination needed beyond the button
// assignment itself).
//
// Assembly names verified against each mod's own .csproj/compiled DLL
// (KRAB's is KRAB9000, not KRAB - checked, not assumed).

@PROP[MFDExt_MFD40x20]:NEEDS[!SituationalAwareness]
{
	@MODULE[RasterPropMonitor]
	{
		PAGE
		{
			name = MFDExt_sa_fallback
			button = button_A
			text = MFDExtension/Props/MFDExt_MFD40x20/sa_not_installed.txt
		}
	}
}

@PROP[MFDExt_MFD40x20]:NEEDS[!RealBattery]
{
	@MODULE[RasterPropMonitor]
	{
		PAGE
		{
			name = MFDExt_battery_fallback
			button = button_B
			text = MFDExtension/Props/MFDExt_MFD40x20/battery_not_installed.txt
		}
	}
}

@PROP[MFDExt_MFD40x20]:NEEDS[!KRAB9000]
{
	@MODULE[RasterPropMonitor]
	{
		PAGE
		{
			name = MFDExt_krab_fallback
			button = button_C
			text = MFDExtension/Props/MFDExt_MFD40x20/krab_not_installed.txt
		}
	}
}

@PROP[MFDExt_MFD40x20]:NEEDS[!KRILL]
{
	@MODULE[RasterPropMonitor]
	{
		PAGE
		{
			name = MFDExt_krill_fallback
			button = button_D
			text = MFDExtension/Props/MFDExt_MFD40x20/krill_not_installed.txt
		}
	}
}
