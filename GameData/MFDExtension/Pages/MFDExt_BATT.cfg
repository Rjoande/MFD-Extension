// Bay B (BATT / RealBattery). Two mutually-exclusive variants, see
// MFDExt_SA.cfg for the pattern explanation and for the multi-line-only
// TEXT node note.

MAS_PAGE:NEEDS[RealBattery]
{
	name = MFDExt_BATT_Placeholder

	TEXT
	{
		position = 10, 8
		text = REALBATTERY MODULE
	}
	TEXT
	{
		position = 16, 9
		text = DETECTED
	}

	TEXT
	{
		position = 6, 11
		text = Awaiting firmware install.
	}
	TEXT
	{
		position = 5, 12
		text = Check for a bay driver update
	}
	TEXT
	{
		position = 8, 13
		text = from your mod provider.
	}
}

MAS_PAGE:NEEDS[!RealBattery]
{
	name = MFDExt_BATT_Placeholder

	TEXT
	{
		position = 10, 8
		text = REALBATTERY MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
