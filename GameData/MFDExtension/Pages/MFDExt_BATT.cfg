// Bay B (BMS / RealBattery, label renamed from "BATT" 2026-08-27). "Not
// detected" fallback only - the real
// content ships from RealBattery's own repository (page name MFDExt_BATT).
//
// NO NEEDS[RealBattery] variant here, and there must never be one again as
// long as RealBattery's own repo also declares an independent MAS_PAGE
// named MFDExt_BATT: MASLoader keeps a single dictionary of page name ->
// page data, and two separate MAS_PAGE nodes that both resolve to the same
// name crash it outright - "ArgumentException: An item with the same key
// has already been added" - confirmed in game (2026-08-19, Player.log)
// once RealBattery shipped its real patch alongside a restored version of
// this variant. This is NOT a soft/local failure: it happens during
// MASLoader's global init, before any prop-specific loading, so it takes
// down Lua script loading for EVERY MAS prop in the game (every
// MASFlightComputer reports "Loaded 0 user scripts", not just ours) -
// worse than the older-RealBattery-version gap this variant was meant to
// cover. See CLAUDE.md and HOSTING.md Gotchas for the corrected guidance -
// a prior log entry claiming two same-named MAS_PAGE nodes "coexist fine"
// was wrong, based on a case (KRILL) that wasn't actually a collision.

MAS_PAGE:NEEDS[!RealBattery]
{
	name = MFDExt_BATT

	TEXT
	{
		position = 10, 8
		text = REALBATTERY MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
