// Bay C (KRAB / KRAB-9000). "Not detected" fallback only - the real content,
// once it exists, ships from KRAB-9000's own repository under this same
// page name.
//
// There must never be a NEEDS[KRAB9000] variant here as well: two MAS_PAGE
// nodes resolving to one name crash MASLoader during its GLOBAL init, which
// takes Lua loading down for every MAS prop in the game. See HOSTING.md.
//
// See MFDExt_SA.cfg for the multi-line-only TEXT node note.

MAS_PAGE:NEEDS[!KRAB9000]
{
	name = MFDExt_KRAB_Placeholder

	TEXT
	{
		position = 12, 8
		text = KRAB-9000 MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
