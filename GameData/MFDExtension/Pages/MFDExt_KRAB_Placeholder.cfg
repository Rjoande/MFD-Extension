// Bay C (KRAB / KRAB-9000). "Not detected" fallback only - the real
// content, once it exists, ships from KRAB-9000's own repository (page
// name MFDExt_KRAB_Placeholder). Replaces the earlier throwaway
// single-variant placeholder used to prove the button-C redirect
// (2026-08-14) - same page name, so no other file needed to change.
//
// NO NEEDS[KRAB9000] variant here, and there must never be one again once
// KRAB-9000's own repo declares an independent MAS_PAGE with this same
// name: MASLoader keeps a single dictionary of page name -> page data, and
// two separate MAS_PAGE nodes that both resolve to the same name crash it
// outright - "ArgumentException: An item with the same key has already
// been added" - confirmed in game (2026-08-19) for the equivalent
// BATT/RealBattery case (Player.log). Not a soft/local failure: it
// happens during MASLoader's global init, so it takes down Lua script
// loading for EVERY MAS prop in the game, not just this mod's. See
// CLAUDE.md and HOSTING.md Gotchas.
//
// See MFDExt_SA.cfg for the multi-line-only TEXT node note.

MAS_PAGE:NEEDS[!KRAB9000]
{
	name = MFDExt_KRAB_Placeholder

	TEXT
	{
		position = 12, 8
		text = KRAB-9000 MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
