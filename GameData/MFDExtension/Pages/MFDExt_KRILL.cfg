// Bay D (KRILL). "Not detected" fallback only - the real content ships from
// KRILL's own repository under the page name MFDExt_KRILL_Placeholder,
// matching the contract in HOSTING.md.
//
// There must never be a NEEDS[KRILL] variant here as well: two MAS_PAGE
// nodes resolving to one name crash MASLoader during its GLOBAL init, which
// takes Lua loading down for every MAS prop in the game. See HOSTING.md.
//
// See MFDExt_SA.cfg for the multi-line-only TEXT node note.

MAS_PAGE:NEEDS[!KRILL]
{
	name = MFDExt_KRILL_Placeholder

	TEXT
	{
		position = 14, 8
		text = KRILL MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
