// Bay D (KRILL). "Not detected" fallback only - the real content
// (including the 2026-08-19 hello-world that used to live here directly,
// see git/log history) is being promoted to ship from KRILL's own
// repository instead (page name MFDExt_KRILL_Placeholder), matching the
// contract in HOSTING.md.
//
// NO NEEDS[KRILL] variant here, and there must never be one again once
// KRILL's own repo declares an independent MAS_PAGE with this same name:
// MASLoader keeps a single dictionary of page name -> page data, and two
// separate MAS_PAGE nodes that both resolve to the same name crash it
// outright - "ArgumentException: An item with the same key has already
// been added" - confirmed in game (2026-08-19) for the equivalent
// BATT/RealBattery case (Player.log), which is exactly the scenario KRILL
// is about to reproduce by moving to its own repo. Not a soft/local
// failure: it happens during MASLoader's global init, so it takes down
// Lua script loading for EVERY MAS prop in the game, not just this mod's.
// See CLAUDE.md and HOSTING.md Gotchas.
//
// See MFDExt_SA.cfg for the multi-line-only TEXT node note.

MAS_PAGE:NEEDS[!KRILL]
{
	name = MFDExt_KRILL_Placeholder

	TEXT
	{
		position = 14, 8
		text = KRILL MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
