// Bay R1 - CAS (Crew Alerting System): a textual WARNING/CAUTION/ADVISORY
// fault summary, useful without VesselViewer or alongside its 3D render on
// a nearby screen.
//
// Unlike the hosted bays this page ships entirely from THIS repo, so it
// exists unconditionally and its CONTENT degrades inside MFDExtCasModule
// instead - never an empty or missing page, so no MASMonitor black-screen
// risk (see HOSTING.md).
//
// No `position` on the TEXT node, matching the one real textmethod example
// in this install: the returned string covers the page itself.

MAS_PAGE
{
	name = MFDExt_CAS

	TEXT
	{
		name = CAS Text
		textmethod = MFDExtCasModule:GetPageText
	}

	// Button-only RPM_MODULE bridge: no renderMethod/renderSize, because the
	// TEXT node above already renders the page and the two coexist as
	// separate components. It mutes DangIt's alarm on the red "x" and scrolls
	// the list - see MFDExtCasModule.ButtonProcessor.
	RPM_MODULE
	{
		moduleName = MFDExtCasModule
		buttonClickMethod = ButtonProcessor
	}
}
