// Bay F - CAS (Crew Alerting System): a textual WARNING/CAUTION/ADVISORY
// fault summary, useful without VesselViewer, or alongside its 3D render
// on a nearby screen. Design discussed and confirmed with the user
// 2026-08-19, see CLAUDE.md and HOSTING.md.
//
// Unlike SA/BATT/KRAB/KRILL, this page ships entirely from THIS repo, not
// an external mod's own - its existence is unconditional (no NEEDS guard
// needed here, matching MFDExt_Stby/MFDExt_ILS/MFDExt_Unclaimed). Its
// CONTENT depends on DangIt/FAR being installed, but that's handled inside
// MFDExtCasModule.GetPageText itself (degrades to an explanatory message,
// never an empty/missing page) - not a page-existence question, so no
// MASMonitor black-screen risk (see the Gotcha about that in HOSTING.md).
//
// No `position` on the TEXT node - matches the one real textmethod example
// in this install (MOARdV/MAS_JSI/MFDPages/MAS_JSI_BasicMFD_E_VesselView.cfg,
// "Vessel Viewer Text"), which doesn't set one either; the returned string
// is expected to cover the page itself.

MAS_PAGE
{
	name = MFDExt_CAS

	TEXT
	{
		name = CAS Text
		textmethod = MFDExtCasModule:GetPageText
	}

	// Button-only RPM_MODULE bridge (no renderMethod/renderSize - this page
	// already renders via the TEXT/textmethod above, the two coexist as
	// separate page components): mutes DangIt's alarm sound on button_ESC
	// (the red "x", softkey id 3 - see MFDExtCasModule.buttonMute). Same
	// mechanism, and confirmed-working precedent, as MFDExt_ILS.cfg's
	// KSF_MLS bridge - see MFDExtCasModule.ButtonProcessor for why this is
	// Lua-free, unlike every other button in this repo.
	RPM_MODULE
	{
		moduleName = MFDExtCasModule
		buttonClickMethod = ButtonProcessor
	}
}
