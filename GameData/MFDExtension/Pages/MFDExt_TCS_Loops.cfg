// Bay R4 - TCS, page 2 of 3: TCS LOOPS. One scrollable group per heat loop
// (header: temperature / nominal, net flux, colored by SystemHeat's own
// thresholds), its members underneath - sources with what they add, sinks
// with what the loop actually allocated to them; zero-flux members are
// counted on a closing "(+N idle)" row instead of listed. UP/DOWN scroll,
// HOME returns to the top. See MFDExt_TCS.cfg for how the three pages share
// one module.

MAS_PAGE
{
	name = MFDExt_TCS_Loops

	TEXT
	{
		name = TCS Loops Text
		textmethod = MFDExtTcsModule:GetLoopsText
	}

	// Button-only RPM_MODULE bridge, same mechanism as MFDExt_CAS.cfg.
	RPM_MODULE
	{
		moduleName = MFDExtTcsModule
		buttonClickMethod = LoopsButtons
	}

	// NEXT/PREV page stepping - see MFDExt_TCS.cfg.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_TCS_Reactors")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_TCS")
}
