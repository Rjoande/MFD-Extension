// Bay R3 - ELEC, page 1 of 3: ELEC SUMMARY. DynamicBatteryStorage's
// ("Systems Monitor") electrical ledger for the whole vessel - net flow,
// generated/consumed, EC level, buffer state, top loads and sources. Pressing
// R3 again cycles SUMMARY -> SOURCES -> LOADS -> SUMMARY (Scripts/MFDExt.lua,
// MFDExt_ELEC_Pages).
//
// Ships entirely from THIS repo, like CAS: the page exists unconditionally
// (no NEEDS guard) and its CONTENT degrades inside MFDExtElecModule itself
// ("DYNAMICBATTERYSTORAGE NOT DETECTED") - never an empty or missing page, so
// no MASMonitor black-screen risk (see HOSTING.md's gotcha about that).
//
// All three ELEC pages share ONE MFDExtElecModule instance; each names its
// own textmethod and its own buttonClickMethod on it, which is what gives
// every page its own scroll offset.

MAS_PAGE
{
	name = MFDExt_ELEC

	TEXT
	{
		name = ELEC Summary Text
		textmethod = MFDExtElecModule:GetSummaryText
	}

	// Button-only RPM_MODULE bridge, same mechanism as MFDExt_CAS.cfg. On
	// this page only ENTER (the green left arrow) does anything: it switches
	// the ledger between PLANT (storage kept out of the totals) and TOTAL.
	RPM_MODULE
	{
		moduleName = MFDExtElecModule
		buttonClickMethod = SummaryButtons
	}

	// NEXT (R9, softkey 7) / PREV (R10, softkey 8) step forward / backward
	// through the three ELEC pages, in parallel with and independent from the
	// R3 cycle (Scripts/MFDExt.lua) - plain per-page softkeys, the same
	// mechanism MFDExt_Stby.cfg uses for the same two keys. A page-level
	// softkey is consumed before the RPM_MODULE bridge sees it, so 7/8 never
	// reach MFDExtElecModule. Deliberately not in the on-screen key legend.
	// Added 2026-09-17 as experimental, validated in game on ELEC and TCS
	// 2026-09-18/19 (user's word).
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_ELEC_Sources")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_ELEC_Loads")
}
