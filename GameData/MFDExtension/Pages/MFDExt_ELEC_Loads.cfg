// Bay R3 - ELEC, page 3 of 3: ELEC LOADS. Every part currently DRAWING from
// the electrical bus, same grouping, keys and layout as MFDExt_ELEC_Sources.
// See MFDExt_ELEC.cfg for how the three pages share one module.

MAS_PAGE
{
	name = MFDExt_ELEC_Loads

	TEXT
	{
		name = ELEC Loads Text
		textmethod = MFDExtElecModule:GetLoadsText
	}

	RPM_MODULE
	{
		moduleName = MFDExtElecModule
		buttonClickMethod = LoadsButtons
	}

	// NEXT/PREV page stepping - see MFDExt_ELEC.cfg.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_ELEC")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_ELEC_Sources")
}
