// MFD Extended standby page: the hub of the additive branch.
//
// Entry: from the host's own standby page, softkey 7 (NEXT) or 8 (PREV).
// Exit: STBY, which is wired prop-wide rather than per page - the "go back"
// behavior lives in Scripts/MFDExt.lua and takes a bay leaf page up to THIS
// hub first rather than straight to the host, one level at a time.
//
// Softkey ids on this model:
//   UP 0, DOWN 1, ENTER 2, ESC 3, HOME 4, RIGHT 5, LEFT 6, R9 7, R10 8,
//   button_A..G 9..15, buttonR1..R7 16..22.
//
// The bay buttons are not bound here: they are wired prop-wide too, and the
// Lua redirect already treats this page like any other of our own.

MAS_PAGE
{
	name = MFDExt_Stby

	TEXT
	{
		name = Top Softkeys
		position = 1, 0
		text = [hw]    SA    |   ILS    |  FADEC   |   SWC    |    --    |    --    |    --
	}

	TEXT
	{
		position = 10, 8
		textmethod = MFDExtVersionModule:GetVersionLine
	}
	TEXT
	{
		position = 6, 9
		text = Open-standard module bay for
	}
	TEXT
	{
		position = 9, 10
		text = third-party avionics
	}

	TEXT
	{
		position = 7, 13
		text = Press STBY to go back
	}

	TEXT
	{
		name = Status line
		position = 0, 17
		textmethod = MFDExtVersionModule:GetStatusLine
	}

	TEXT
	{
		name = Bottom Softkeys
		position = 1, 19
		text = [hw]   CAS    |   BMS    |   ELEC   |   TCS    |    --    |    --    |    --
	}

	// NEXT/PREV, symmetric: either one goes back to the host's home, mirroring
	// how either one enters from the host's own home page.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MAS_JSI_BasicMFD_Home")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MAS_JSI_BasicMFD_Home")
}
