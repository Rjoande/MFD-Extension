// MFD Extended standby page (hub of the additive branch, MAS side).
//
// Entry: from the host's own standby page, softkey 7 (R9/NEXT) OR softkey
// 8 (R10/PREV) both jump here - see Config/Additive/MAS_BasicMFD.cfg.
// Exit: STBY goes back to the host's home. STBY is NOT a per-page softkey
// on this model (wired once, prop-wide, like most of A-G) - the "go back"
// behavior is implemented in Scripts/MFDExt.lua (MFDExt_ButtonSTBY), which
// also makes STBY go from a leaf bay page (SA/BATT/KRAB/KRILL/ILS) back up
// to THIS hub first, rather than straight to the host - one level at a
// time, matching the original navigation design.
//
// Softkey ids on this model (from MAS_JSI_BasicMFD.cfg comments):
//   UP 0, DOWN 1, ENTER 2, ESC 3, HOME 4, RIGHT 5, LEFT 6, R9 7, R10 8,
//   button_A..G 9..15, buttonR1..R7 16..22.
//
// Buttons A and D route through softkey (9 and 12 respectively) rather
// than being wired prop-wide like B/C/E/STBY - a plain per-page softkey
// binding is enough for them, no Lua needed (see MFDExt_ButtonB/C/E/STBY
// in Scripts/MFDExt.lua for the ones that DO need it).

MAS_PAGE
{
	name = MFDExt_Stby

	TEXT
	{
		name = Top Softkeys
		position = 1, 0
		text = [hw]    SA    |   BATT   |   KRAB   |  KRILL   |    ILS   |    --    |    --
	}

	TEXT
	{
		position = 10, 8
		text = MFD Extended v0.1.0
	}
	TEXT
	{
		position = 6, 9
		text = Open-standard module bay for
	}
	TEXT
	{
		position = 9, 10
		text = third-party avionics
	}

	TEXT
	{
		position = 7, 13
		text = Press STBY to go back
	}

	TEXT
	{
		name = Status line
		position = 0, 17
		text = -[hw] MFDEXT[/hw] MFD Extended v0.1.0
	}

	TEXT
	{
		name = Bottom Softkeys
		position = 1, 19
		text = [hw]    --    |    --    |    --    |    --    |    --    |    --    |    --
	}

	// Button A ("SA") and D ("KRILL") - softkey-routed, no Lua needed.
	softkey = 9, fc.SetPersistent("%AUTOID%", "MFDExt_SA_Placeholder")
	softkey = 12, fc.SetPersistent("%AUTOID%", "MFDExt_KRILL_Placeholder")

	// NEXT/PREV, symmetric: either one toggles back to the host's home from
	// here, mirroring how either one enters from the host's own home page.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MAS_JSI_BasicMFD_Home")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MAS_JSI_BasicMFD_Home")
}
