// Bay R3 - ELEC, page 2 of 3: ELEC SOURCES. Every part currently FEEDING the
// electrical bus, grouped by DynamicBatteryStorage's own categories (plus an
// OTHER bucket for handlers DBS's own window silently drops), each group with
// its subtotal. Scrolls with the monitor's up/down keys, the white circle
// jumps back to the top, ENTER (the green left arrow) switches PLANT/TOTAL. See
// MFDExt_ELEC.cfg for how the three pages share one module.

MAS_PAGE
{
	name = MFDExt_ELEC_Sources

	TEXT
	{
		name = ELEC Sources Text
		textmethod = MFDExtElecModule:GetSourcesText
	}

	RPM_MODULE
	{
		moduleName = MFDExtElecModule
		buttonClickMethod = SourcesButtons
	}

	// NEXT/PREV page stepping - see MFDExt_ELEC.cfg.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_ELEC_Loads")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_ELEC")
}
