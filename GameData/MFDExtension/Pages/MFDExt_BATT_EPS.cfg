// Bay B (BMS / RealBattery, label renamed from "BATT" 2026-08-27). "Not
// detected" fallback only - the real content ships from RealBattery's own
// repository.
//
// RENAMED from MFDExt_BATT to MFDExt_BATT_EPS (2026-09-15): the bay's
// button-B entry point moved when a third page (MFDExt_BATT_EPS, a
// vessel-wide EPS summary) was added ahead of the existing two - see
// CLAUDE.md log 82. The OLD MFDExt_BATT (per-vessel telemetry) and
// MFDExt_BATT_Fleet pages are now reached only by cycling B from this one,
// so only the entry page needs a framework-side "not detected" fallback -
// the other two are never a direct button target and, with RealBattery
// absent, are never registered by its own repo either (same NEEDS[RealBattery]
// gate throughout), so there's nothing to fall back FROM for them.
//
// NO NEEDS[RealBattery] variant here, and there must never be one again as
// long as RealBattery's own repo also declares an independent MAS_PAGE
// named MFDExt_BATT_EPS: MASLoader keeps a single dictionary of page name ->
// page data, and two separate MAS_PAGE nodes that both resolve to the same
// name crash it outright - "ArgumentException: An item with the same key
// has already been added" - confirmed in game (2026-08-19, Player.log)
// once RealBattery shipped its real patch alongside a restored version of
// this variant (back when this page was still named MFDExt_BATT). This is
// NOT a soft/local failure: it happens during MASLoader's global init,
// before any prop-specific loading, so it takes down Lua script loading for
// EVERY MAS prop in the game (every MASFlightComputer reports "Loaded 0
// user scripts", not just ours) - worse than the older-RealBattery-version
// gap this variant was meant to cover. See CLAUDE.md and HOSTING.md Gotchas
// for the corrected guidance - a prior log entry claiming two same-named
// MAS_PAGE nodes "coexist fine" was wrong, based on a case (KRILL) that
// wasn't actually a collision.

MAS_PAGE:NEEDS[!RealBattery]
{
	name = MFDExt_BATT_EPS

	TEXT
	{
		position = 10, 8
		text = REALBATTERY MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
