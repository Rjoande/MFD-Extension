// Bay R2 (BMS / RealBattery). "Not detected" fallback only - the real
// content ships from RealBattery's own repository.
//
// Only the bay's ENTRY page needs a fallback: the other two RealBattery
// pages are reached by cycling the bay button from here, and with
// RealBattery absent that cycle doesn't exist, so there is nothing to fall
// back from for them.
//
// There must never be a NEEDS[RealBattery] variant here as well: two
// MAS_PAGE nodes resolving to one name crash MASLoader during its GLOBAL
// init, which takes Lua loading down for every MAS prop in the game. That
// one is confirmed in game, not theoretical. See HOSTING.md.

MAS_PAGE:NEEDS[!RealBattery]
{
	name = MFDExt_BATT_EPS

	TEXT
	{
		position = 10, 8
		text = REALBATTERY MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
