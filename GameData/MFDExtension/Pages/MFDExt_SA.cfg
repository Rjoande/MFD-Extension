// Bay A (SA / SituationalAwareness). "Not detected" fallback only - the
// real content, once it exists, ships from SituationalAwareness's own
// repository (page name MFDExt_SA_Placeholder).
//
// NO NEEDS[SituationalAwareness] variant here, and there must never be one
// again once SituationalAwareness's own repo declares an independent
// MAS_PAGE with this same name: MASLoader keeps a single dictionary of
// page name -> page data, and two separate MAS_PAGE nodes that both
// resolve to the same name crash it outright - "ArgumentException: An
// item with the same key has already been added" - confirmed in game
// (2026-08-19) for the equivalent BATT/RealBattery case (Player.log). Not
// a soft/local failure: it happens during MASLoader's global init, so it
// takes down Lua script loading for EVERY MAS prop in the game, not just
// this mod's. See CLAUDE.md and HOSTING.md Gotchas.
//
// Multi-line TEXT nodes only - the compact one-line-with-semicolon form
// tried in an earlier draft of this file was never verified against any
// real cfg in this install and turned out not to render (2026-08-18).

MAS_PAGE:NEEDS[!SituationalAwareness]
{
	name = MFDExt_SA_Placeholder

	TEXT
	{
		position = 6, 8
		text = SITUATIONALAWARENESS MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
