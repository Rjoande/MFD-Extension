// Bay A (SA / SituationalAwareness). "Not detected" fallback only - the real
// content, once it exists, ships from SituationalAwareness's own repository
// under the page name MFDExt_SA_Placeholder.
//
// There must never be a NEEDS[SituationalAwareness] variant here as well:
// two MAS_PAGE nodes resolving to one name crash MASLoader during its GLOBAL
// init, which takes Lua loading down for every MAS prop in the game, not
// just this mod's. See HOSTING.md's gotchas.
//
// Multi-line TEXT nodes only: the compact one-line form with semicolons does
// not render.

MAS_PAGE:NEEDS[!SituationalAwareness]
{
	name = MFDExt_SA_Placeholder

	TEXT
	{
		position = 6, 8
		text = SITUATIONALAWARENESS MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
