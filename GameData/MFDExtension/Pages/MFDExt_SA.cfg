// Bay A (SA / SituationalAwareness). Two mutually-exclusive variants of the
// SAME page name, gated by NEEDS - only one ever loads, no naming
// collision. Same pattern as the old branch-A ModuleBays.cfg fallback,
// reused here for the additive branch.
//
// Multi-line TEXT nodes only - the compact one-line-with-semicolon form
// tried in an earlier draft of this file was never verified against any
// real cfg in this install and turned out not to render (2026-08-18).

MAS_PAGE:NEEDS[SituationalAwareness]
{
	name = MFDExt_SA_Placeholder

	TEXT
	{
		position = 6, 8
		text = SITUATIONALAWARENESS MODULE
	}
	TEXT
	{
		position = 16, 9
		text = DETECTED
	}

	TEXT
	{
		position = 6, 11
		text = Awaiting firmware install.
	}
	TEXT
	{
		position = 5, 12
		text = Check for a bay driver update
	}
	TEXT
	{
		position = 8, 13
		text = from your mod provider.
	}
}

MAS_PAGE:NEEDS[!SituationalAwareness]
{
	name = MFDExt_SA_Placeholder

	TEXT
	{
		position = 6, 8
		text = SITUATIONALAWARENESS MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
