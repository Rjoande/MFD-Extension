// Bay R4 - TCS, page 3 of 3: TCS REACTORS. One four-row block per reactor
// (SystemHeat fission reactors and engines; FarFutureTechnologies fusion
// reactors and engines, degraded to what SystemHeat's own reactor panel
// reads from them): state, electrical output, heat output, core temperature
// vs nominal, throttle, core integrity, fuel life. UP/DOWN scroll by
// reactor, HOME returns to the top. See MFDExt_TCS.cfg for how the three
// pages share one module.

MAS_PAGE
{
	name = MFDExt_TCS_Reactors

	// Host-style title bar over row 0 (band + rule, as the host's own bg01)
	// plus a grey band under the status row 19. Declared before TEXT so the
	// text draws on top.
	IMAGE
	{
		texture = MFDExtension/Textures/bg02
		position = 0, 0
		size = 640, 640
	}

	TEXT
	{
		name = TCS Reactors Text
		textmethod = MFDExtTcsModule:GetReactorsText
	}

	RPM_MODULE
	{
		moduleName = MFDExtTcsModule
		buttonClickMethod = ReactorsButtons
	}

	// NEXT/PREV page stepping - see MFDExt_TCS.cfg.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_TCS")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_TCS_Loops")
}
