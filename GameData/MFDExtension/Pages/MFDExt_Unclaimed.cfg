// Shared placeholder for every button that isn't a real bay yet: E, F, G
// and R5-R7 (CREW-RSRC-EXT) since the 2026-09-19 thematic reorder (it
// started as F, G and the whole bottom row, 2026-08-19). Before this
// page existed, pressing any of those from inside our own world would
// silently drop the player into the host's own ecosystem (their real
// native pages) with no way back to MFDExt short of re-entering through
// NEXT/PREV - STBY from a host page goes straight to the host's home, not
// back to our hub, since the host page was never one of MFDExt_OwnPages.
// This page keeps all of them inside our world instead: one shared target,
// registered once in MFDExt_OwnPages, so STBY from here returns to
// MFDExt_Stby like any other bay leaf page. See Scripts/MFDExt.lua
// (MFDExt_ButtonE/F/G/R5..R7) and HOSTING.md.
//
// One page, not six near-duplicates - the content is the same regardless
// of which of the free buttons got you here.

MAS_PAGE
{
	name = MFDExt_Unclaimed

	TEXT
	{
		position = 8, 8
		text = UNASSIGNED MODULE SLOT
	}

	TEXT
	{
		position = 5, 11
		text = No tenant assigned.
	}
	TEXT
	{
		position = 5, 12
		text = This space intentionally left
	}
	TEXT
	{
		position = 5, 13
		text = available for lease.
	}

	TEXT
	{
		position = 5, 15
		text = See HOSTING.md to apply.
	}
}
