// Shared placeholder for every button that isn't a real bay yet (E, F, G and
// R5-R7). Without it, pressing one from inside our own world would drop the
// player into the host's native pages with no way back short of re-entering
// through NEXT/PREV: STBY from a host page goes to the host's home, not to
// our hub, since that page is not one of MFDExt_OwnPages.
//
// One page rather than six near-duplicates - the content doesn't depend on
// which free button got you here - registered once in MFDExt_OwnPages, so
// STBY from here returns to the hub like any other bay leaf.

MAS_PAGE
{
	name = MFDExt_Unclaimed

	TEXT
	{
		position = 8, 8
		text = UNASSIGNED MODULE SLOT
	}

	TEXT
	{
		position = 5, 11
		text = No tenant assigned.
	}
	TEXT
	{
		position = 5, 12
		text = This space intentionally left
	}
	TEXT
	{
		position = 5, 13
		text = available for lease.
	}

	TEXT
	{
		position = 5, 15
		text = See HOSTING.md to apply.
	}
}
