// Bay R4 - TCS (Thermal Control System), page 1 of 3: TCS SUMMARY.
// SystemHeat's thermal picture for the whole vessel - heat generated and
// rejected, one row per heat loop (temperature vs nominal, net flux, status),
// reactor / cryo tank / heat sink counts. Pressing R4 again cycles
// SUMMARY -> LOOPS -> REACTORS -> SUMMARY (Scripts/MFDExt.lua, MFDExt_TCS_Pages).
//
// Ships entirely from THIS repo, like CAS and ELEC: the page exists
// unconditionally (no NEEDS guard) and its CONTENT degrades inside
// MFDExtTcsModule itself ("SYSTEMHEAT NOT DETECTED") - never an empty or
// missing page, so no MASMonitor black-screen risk (see HOSTING.md).
//
// All three TCS pages share ONE MFDExtTcsModule instance; the two list pages
// each name their own textmethod and buttonClickMethod on it. This summary
// binds no physical key, hence no RPM_MODULE here.

MAS_PAGE
{
	name = MFDExt_TCS

	TEXT
	{
		name = TCS Summary Text
		textmethod = MFDExtTcsModule:GetSummaryText
	}

	// NEXT (R9, softkey 7) / PREV (R10, softkey 8) step through the three TCS
	// pages, independently of the R4 cycle - same mechanism as ELEC. Not in
	// the on-screen key legend.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_TCS_Loops")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_TCS_Reactors")
}
