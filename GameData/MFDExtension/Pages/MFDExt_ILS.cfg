// Bay E (ILS / NavInstruments). Two mutually-exclusive variants, see
// MFDExt_SA.cfg for the general pattern - but this one is different in
// kind, not just content: NavInstruments already has real, working RPM
// handler code (KSF_MLS/DrawMLS, the HSI/ILS display), it just has no MFD
// of its own - its own addTo*.cfg patches inject into OTHER mods' MFD
// props, and every one of those is RPM-side, so on a MAS-promoted install
// (see CLAUDE.md "JSI-to-MAS" note) they are all silently dead, same as
// our own old RPM branch was. Bridging its real handler into our page
// through RPM_MODULE (see Config/Additive/MAS_BasicMFD.cfg) rescues
// working functionality instead of leaving it orphaned - "parasitic"
// integration replaced with a hosted one.
//
// Confirmed working in game 2026-08-18 (the RPM_MODULE bridge itself).

MAS_PAGE:NEEDS[NavInstruments]
{
	name = MFDExt_ILS

	// Bridges NavInstruments' own KSF_MLS/DrawMLS RPM-style background
	// handler (see the sibling MODULE registration in
	// Config/Additive/MAS_BasicMFD.cfg - MAS does not auto-instantiate an
	// RPM_MODULE target the way RPM itself would).
	RPM_MODULE
	{
		moduleName = KSF_MLS
		renderMethod = DrawMLS
		buttonClickMethod = ButtonProcessor
		renderSize = 640, 640
	}
}

MAS_PAGE:NEEDS[!NavInstruments]
{
	name = MFDExt_ILS

	TEXT
	{
		position = 11, 8
		text = NAVINSTRUMENTS MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
