// Bay B (ILS / NavInstruments). Two mutually exclusive variants, like the
// other hosted bays, but different in kind: NavInstruments already has
// working RPM handler code (KSF_MLS/DrawMLS, the HSI/ILS display) and no MFD
// of its own, and its own patches inject into OTHER mods' RPM props - all of
// which are silently dead on a MAS-promoted install. Bridging its handler in
// through RPM_MODULE rescues working functionality instead of orphaning it.

MAS_PAGE:NEEDS[NavInstruments]
{
	name = MFDExt_ILS

	// Bridges NavInstruments' own KSF_MLS/DrawMLS handler; its sibling MODULE
	// registration is in MAS_BasicMFD.cfg, because MAS does not
	// auto-instantiate an RPM_MODULE target the way RPM itself would.
	RPM_MODULE
	{
		moduleName = KSF_MLS
		renderMethod = DrawMLS
		buttonClickMethod = ButtonProcessor
		renderSize = 640, 640
	}
}

MAS_PAGE:NEEDS[!NavInstruments]
{
	name = MFDExt_ILS

	TEXT
	{
		position = 11, 8
		text = NAVINSTRUMENTS MODULE
	}
	TEXT
	{
		position = 14, 9
		text = NOT DETECTED
	}

	TEXT
	{
		position = 7, 11
		text = This bay is unconfigured.
	}
	TEXT
	{
		position = 7, 12
		text = Contact your mod provider
	}
	TEXT
	{
		position = 7, 13
		text = for compatible hardware.
	}
}
