// Additive-branch entry point for the MAS flavour of BasicMFD.
//
// Why MAS and not RPM: MOARdV/Patches/000_JSI-To-MAS.cfg line 48 patches
// @INTERNAL[*]:FINAL and renames EVERY placed RasterPropMonitorBasicMFD
// prop instance to MAS_JSI_BasicMFD (all indices, no guards). So in any
// install with AvionicsSystems present, the monitor the player actually
// sees is the MAS one - patching the RPM prop definition applies cleanly
// but affects nothing (verified in game: no error, no effect). The RPM
// equivalent of this file is kept, untested, in _deprecated/rpm-only/.
//
// All edits below use fully public, documented MAS mechanisms - no
// reflection, no C#, unlike the RPM path this replaces.

// 0. Lua scripts (MAS_LUA) must be declared as a TOP-LEVEL node, never
//    nested inside a @PROP block - confirmed 2026-08-14 against the real
//    example in MOARdV/Scripts/MAS_Scripts.cfg. Nesting it (as this file
//    originally did) means MAS's loader never finds it: the function
//    silently never exists, and calling it throws "attempt to call a nil
//    value" - not a bug in the Lua logic itself, a declaration-placement
//    bug.
MAS_LUA
{
	name = MFDExt_Scripts
	script = MFDExtension/Scripts/MFDExt.lua
}

// 1. Register our pages with the host monitor. MASMonitor takes an explicit
//    `page =` list; a MAS_PAGE that isn't listed here is never reachable.
//
//    ⚠ THE REVERSE IS FATAL: a name listed here with no MAS_PAGE behind it
//    makes MASMonitor.Start() throw ("No MAS_PAGE found for '...'") and the
//    ENTIRE monitor fails to configure - black screen, every page gone,
//    host pages included. Confirmed in game 2026-08-19 (Player.log): with
//    all four mods installed, every NEEDS[!X] fallback of ours was deleted
//    by MM, three of the four bays had no page from their own mod yet, and
//    every BasicMFD in the IVA went dark. So: EVERY `page =` line below
//    must be gated by exactly the same condition as the page's own
//    existence - never register unconditionally what only exists
//    conditionally.
//
//    Our own repo only guarantees a page's existence in these cases:
//    - MFDExt_Stby, MFDExt_Unclaimed, MFDExt_CAS: ungated MAS_PAGE, always
//      exist (MFDExt_CAS's CONTENT depends on DangIt/FAR, but the page and
//      its MFDExtCasModule backing it are unconditional - see §5).
//    - MFDExt_ILS: two mutually-exclusive variants (NEEDS[NavInstruments] /
//      NEEDS[!NavInstruments]) both living in OUR repo - exactly one
//      always loads, so unconditional registration is safe.
//    - Each bay fallback: exists only when its mod is ABSENT (NEEDS[!X]) -
//      registered under that same condition below.
//    When a bay's mod IS installed, the real page ships from that mod's
//    own repo, and THAT repo must also register it in this list (see
//    HOSTING.md) - we can't know from here whether an installed version
//    actually carries the patch, and guessing wrong is the black screen
//    above, not a dead button.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_Stby
		page = MFDExt_ILS
		page = MFDExt_Unclaimed
		page = MFDExt_CAS
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&!SituationalAwareness]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_SA_Placeholder
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&!RealBattery]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_BATT
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&!KRAB9000]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_KRAB_Placeholder
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&!KRILL]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_KRILL_Placeholder
	}
}

// 2. Softkeys 7 (R9/NEXT) and 8 (R10/PREV), from the host's own standby
//    page, BOTH jump to our hub - symmetric, either one works. Softkeys are
//    per-page in MAS, so no other page's use of R9/R10 is touched. Verified
//    free here: MAS_JSI_BasicMFD_Home defines only softkeys 9, 12 and 17.
@MAS_PAGE[MAS_JSI_BasicMFD_Home]:NEEDS[AvionicsSystems]:FINAL
{
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_Stby")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_Stby")
}

// 3. Buttons A-G, R1-R7 and STBY are NOT per-page softkeys - each is wired
//    once, prop-wide, on MASComponent, straight to a fixed action via
//    onClick (verified on the real source for every one of them,
//    2026-08-09/14/19). "?" is MM's single-character wildcard, standing in
//    for the literal space in each collider's `name =` field (a raw space
//    in a `[...]` selector fails to load - confirmed in game 2026-08-14).
//
//    A/D/R2 route natively through fc.SendSoftkey (9/12/17 respectively) -
//    a per-page softkey binding that, on the host's own home page, reads a
//    dynamic per-monitor preference rather than a fixed target. The other
//    eight (B/C/F/G/STBY/R1/R3-R7) have a fixed onClick straight to one
//    native page. All fifteen are overridden here the same way (onClick +
//    Lua), with a `hostFallback` closure per button in Scripts/MFDExt.lua
//    that replays whichever native scheme that specific button actually
//    uses - never assume one from another, check the source per button.
//
//    A: SA bay.
//    B: incidentally fixes an upstream typo in the host's own file (see
//       Scripts/MFDExt.lua for detail - not our bug, but our override
//       supplies the correct target either way).
//    C: KRAB bay.
//    D: KRILL bay.
//    E: repurposed for NavInstruments/ILS (see Pages/MFDExt_ILS.cfg) -
//       native VesselView target preserved outside our world.
//    F, G, R1-R7 (NAV/ORB/DOCK/DATA/CREW/RSRC/EXT): not real bays yet -
//       share one placeholder (MFDExt_Unclaimed) instead of leaking into
//       the host's own ecosystem when pressed from inside our world (the
//       problem: STBY from a host page goes straight to host home, not
//       back to our hub, so wandering into e.g. Docking from our own
//       standby meant starting our navigation over to get back). See
//       Pages/MFDExt_Unclaimed.cfg.
//    STBY: needs its own logic (go up one level, not straight to host) -
//       see MFDExt_ButtonSTBY in Scripts/MFDExt.lua.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	@MODULE[MASComponent]
	{
		@COLLIDER_EVENT[A?button]
		{
			@onClick = MFDExt_ButtonA("%AUTOID%")
		}
		@COLLIDER_EVENT[B?button]
		{
			@onClick = MFDExt_ButtonB("%AUTOID%")
		}
		@COLLIDER_EVENT[C?button]
		{
			@onClick = MFDExt_ButtonC("%AUTOID%")
		}
		@COLLIDER_EVENT[D?button]
		{
			@onClick = MFDExt_ButtonD("%AUTOID%")
		}
		@COLLIDER_EVENT[E?button]
		{
			@onClick = MFDExt_ButtonE("%AUTOID%")
		}
		@COLLIDER_EVENT[F?button]
		{
			@onClick = MFDExt_ButtonF("%AUTOID%")
		}
		@COLLIDER_EVENT[G?button]
		{
			@onClick = MFDExt_ButtonG("%AUTOID%")
		}
		@COLLIDER_EVENT[R1?button]
		{
			@onClick = MFDExt_ButtonR1("%AUTOID%")
		}
		@COLLIDER_EVENT[R2?button]
		{
			@onClick = MFDExt_ButtonR2("%AUTOID%")
		}
		@COLLIDER_EVENT[R3?button]
		{
			@onClick = MFDExt_ButtonR3("%AUTOID%")
		}
		@COLLIDER_EVENT[R4?button]
		{
			@onClick = MFDExt_ButtonR4("%AUTOID%")
		}
		@COLLIDER_EVENT[R5?button]
		{
			@onClick = MFDExt_ButtonR5("%AUTOID%")
		}
		@COLLIDER_EVENT[R6?button]
		{
			@onClick = MFDExt_ButtonR6("%AUTOID%")
		}
		@COLLIDER_EVENT[R7?button]
		{
			@onClick = MFDExt_ButtonR7("%AUTOID%")
		}
		@COLLIDER_EVENT[STBY?button]
		{
			@onClick = MFDExt_ButtonSTBY("%AUTOID%")
		}
	}
}

// 4. NavInstruments' own KSF_MLS handler (see Pages/MFDExt_ILS.cfg) needs
//    manual instantiation as a sibling MODULE on this prop - MAS's
//    RPM_MODULE bridge does not auto-instantiate the way RPM itself does
//    for PAGEHANDLER/BACKGROUNDHANDLER (confirmed on the MAS wiki,
//    "MASMonitor" page: "you must manually add the RPM module's
//    configuration to the prop itself"). Field values mirror
//    NavInstruments' own RPM patch (NavInstruments/MFD/addToRPM018.cfg)
//    for the same handler. LEAST VERIFIED block in this file.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&NavInstruments]:FINAL
{
	MODULE
	{
		name = KSF_MLS
		btnPrevRwy = 6
		btnNextRwy = 5
		btnDefaultRwyGS = 3
	}
}

// 5. CAS bay (F) - MFDExtCasModule is OUR OWN InternalModule (src/Cas/),
//    registered the same manual-companion-MODULE way as KSF_MLS above, but
//    unconditional: it doesn't bridge an external mod's own RPM handler,
//    it's this repo's first compiled code shipped in this release (see
//    CLAUDE.md - "no DLL required" is no longer true once this bay is
//    included). No fields needed - DangIt/FAR presence is checked inside
//    the module itself (CasAggregator.IsAssemblyLoaded), not via NEEDS
//    here, so the module (and therefore the page) always exists and
//    degrades gracefully instead of risking the page-registration
//    black-screen described in §1.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	MODULE
	{
		name = MFDExtCasModule
	}
}
