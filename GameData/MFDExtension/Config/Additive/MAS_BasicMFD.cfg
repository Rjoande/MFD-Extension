// Additive-branch entry point for the MAS flavour of BasicMFD.
//
// MAS and not RPM: MOARdV/Patches/000_JSI-To-MAS.cfg renames every placed
// RasterPropMonitorBasicMFD instance to MAS_JSI_BasicMFD, so wherever
// AvionicsSystems is installed the monitor the player sees is the MAS one -
// patching the RPM prop applies cleanly and does nothing. The RPM equivalent
// of this file is kept, untested, in _deprecated/rpm-only/.
//
// Everything below uses public, documented MAS mechanisms only.

// 0. MAS_LUA must be a TOP-LEVEL node, never nested inside a @PROP block:
//    nested, MAS's loader never finds it, the functions silently do not
//    exist, and calling one throws "attempt to call a nil value".
MAS_LUA
{
	name = MFDExt_Scripts
	script = MFDExtension/Scripts/MFDExt.lua
}

// 1. Register our pages with the host monitor: MASMonitor takes an explicit
//    `page =` list, and a MAS_PAGE missing from it is unreachable.
//
//    ⚠ THE REVERSE IS FATAL: a name listed here with no MAS_PAGE behind it
//    makes MASMonitor.Start() throw and the ENTIRE monitor fail to
//    configure - black screen, host pages included. So every `page =` line
//    must carry exactly the same gate as the page's own existence.
//
//    Unconditional here: the pages this repo always defines, plus
//    MFDExt_ILS (two mutually exclusive variants, exactly one always
//    loads). Each bay fallback is registered under its own NEEDS[!X]; when
//    that mod IS installed, its repo ships both the page and this
//    registration - see HOSTING.md.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_Stby
		page = MFDExt_ILS
		page = MFDExt_Unclaimed
		page = MFDExt_CAS
		page = MFDExt_ELEC
		page = MFDExt_ELEC_Sources
		page = MFDExt_ELEC_Loads
		page = MFDExt_TCS
		page = MFDExt_TCS_Loops
		page = MFDExt_TCS_Reactors
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&!SituationalAwareness]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_SA_Placeholder
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&!RealBattery]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_BATT_EPS
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&!KRAB9000]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_KRAB_Placeholder
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&!KRILL]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_KRILL_Placeholder
	}
}

// 2. Softkeys 7 (R9/NEXT) and 8 (R10/PREV) on the host's own standby page
//    both jump to our hub, symmetrically. Softkeys are per-page in MAS, so
//    no other page's use of R9/R10 is touched; the host's home page binds
//    only 9, 12 and 17.
@MAS_PAGE[MAS_JSI_BasicMFD_Home]:NEEDS[AvionicsSystems]:FINAL
{
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_Stby")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_Stby")
}

// 3. A-G, R1-R7 and STBY are NOT per-page softkeys: each is wired once,
//    prop-wide, on MASComponent, straight to a fixed action via onClick.
//    "?" is MM's single-character wildcard standing in for the literal
//    space in each collider's name - a raw space in a [...] selector fails
//    to load.
//
//    A/D/R2 route natively through fc.SendSoftkey (9/12/17), which on the
//    host's home page reads a per-monitor preference instead of a fixed
//    target; the other twelve have a fixed onClick. All fifteen are
//    overridden the same way here, each with its own hostFallback in
//    Scripts/MFDExt.lua replaying that button's native scheme - never
//    assume one button's behavior from another's, check the source.
//
//    Buttons without a bay of their own share one placeholder page rather
//    than leak into the host's world, where STBY would lead to the host's
//    home instead of back to our hub. STBY has its own three-way logic -
//    see MFDExt_ButtonSTBY.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	@MODULE[MASComponent]
	{
		@COLLIDER_EVENT[A?button]
		{
			@onClick = MFDExt_ButtonA("%AUTOID%")
		}
		@COLLIDER_EVENT[B?button]
		{
			@onClick = MFDExt_ButtonB("%AUTOID%")
		}
		@COLLIDER_EVENT[C?button]
		{
			@onClick = MFDExt_ButtonC("%AUTOID%")
		}
		@COLLIDER_EVENT[D?button]
		{
			@onClick = MFDExt_ButtonD("%AUTOID%")
		}
		@COLLIDER_EVENT[E?button]
		{
			@onClick = MFDExt_ButtonE("%AUTOID%")
		}
		@COLLIDER_EVENT[F?button]
		{
			@onClick = MFDExt_ButtonF("%AUTOID%")
		}
		@COLLIDER_EVENT[G?button]
		{
			@onClick = MFDExt_ButtonG("%AUTOID%")
		}
		@COLLIDER_EVENT[R1?button]
		{
			@onClick = MFDExt_ButtonR1("%AUTOID%")
		}
		@COLLIDER_EVENT[R2?button]
		{
			@onClick = MFDExt_ButtonR2("%AUTOID%")
		}
		@COLLIDER_EVENT[R3?button]
		{
			@onClick = MFDExt_ButtonR3("%AUTOID%")
		}
		@COLLIDER_EVENT[R4?button]
		{
			@onClick = MFDExt_ButtonR4("%AUTOID%")
		}
		@COLLIDER_EVENT[R5?button]
		{
			@onClick = MFDExt_ButtonR5("%AUTOID%")
		}
		@COLLIDER_EVENT[R6?button]
		{
			@onClick = MFDExt_ButtonR6("%AUTOID%")
		}
		@COLLIDER_EVENT[R7?button]
		{
			@onClick = MFDExt_ButtonR7("%AUTOID%")
		}
		@COLLIDER_EVENT[STBY?button]
		{
			@onClick = MFDExt_ButtonSTBY("%AUTOID%")
		}
	}
}

// 4. NavInstruments' own KSF_MLS handler (see Pages/MFDExt_ILS.cfg) needs
//    manual instantiation as a sibling MODULE on this prop: MAS's
//    RPM_MODULE bridge does not auto-instantiate the way RPM itself does
//    for PAGEHANDLER/BACKGROUNDHANDLER. The field values mirror
//    NavInstruments' own RPM patch for the same handler.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&NavInstruments]:FINAL
{
	MODULE
	{
		name = KSF_MLS
		btnPrevRwy = 6
		btnNextRwy = 5
		btnDefaultRwyGS = 3
	}
}

// 5. CAS bay (R1) - MFDExtCasModule, our own InternalModule (src/Cas/),
//    registered the same manual-companion way as KSF_MLS above but
//    unconditionally: the fault sources are checked inside the module, so
//    the page always exists and degrades gracefully instead of risking the
//    black screen of section 1.
//
//    buttonMute is the DangIt mute-all bridge, buttonUp/Down/Home scroll
//    the fault list. Spelled out here although they match the fields' own
//    defaults, the same self-documenting convention as KSF_MLS above.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	MODULE
	{
		name = MFDExtCasModule
		buttonMute = 3
		buttonUp = 0
		buttonDown = 1
		buttonHome = 4
	}
}

// 6. Hub version line (Pages/MFDExt_Stby.cfg) - same registration pattern as
//    section 5, its own class because it is a hub-wide concern rather than
//    part of CAS. Reads AssemblyVersion at runtime so the on-screen version
//    cannot go stale the way a static TEXT literal did.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	MODULE
	{
		name = MFDExtVersionModule
	}
}

// 7. ELEC bay (R3) - MFDExtElecModule, DynamicBatteryStorage's electrical
//    ledger on three pages, registered unconditionally for the same reason
//    as CAS: DBS's presence is checked inside the module, so the pages say
//    "not detected" rather than not existing.
//
//    ONE instance serves all three pages, each naming its own textmethod
//    and buttonClickMethod on it. buttonMode switches the ledger between
//    PLANT (storage out of the totals) and TOTAL; buttonUp/Down/Home scroll
//    the two lists. NEXT/PREV are per-page softkeys in the page files.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	MODULE
	{
		name = MFDExtElecModule
		buttonMode = 2
		buttonUp = 0
		buttonDown = 1
		buttonHome = 4
	}
}

// 8. TCS bay (R4) - MFDExtTcsModule, SystemHeat's loops, loop members and
//    reactors on three pages, registered unconditionally like CAS and ELEC.
//    ONE instance serves all three; buttonUp/Down/Home scroll the two list
//    pages, the summary binds no key. NEXT/PREV are per-page softkeys.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	MODULE
	{
		name = MFDExtTcsModule
		buttonUp = 0
		buttonDown = 1
		buttonHome = 4
	}
}
