// Additive-branch entry point for the MAS flavour of BasicMFD.
//
// Why MAS and not RPM: MOARdV/Patches/000_JSI-To-MAS.cfg line 48 patches
// @INTERNAL[*]:FINAL and renames EVERY placed RasterPropMonitorBasicMFD
// prop instance to MAS_JSI_BasicMFD (all indices, no guards). So in any
// install with AvionicsSystems present, the monitor the player actually
// sees is the MAS one - patching the RPM prop definition applies cleanly
// but affects nothing (verified in game: no error, no effect). The RPM
// equivalent of this file is kept, untested, in _deprecated/rpm-only/.
//
// All edits below use fully public, documented MAS mechanisms - no
// reflection, no C#, unlike the RPM path this replaces.

// 0. Lua scripts (MAS_LUA) must be declared as a TOP-LEVEL node, never
//    nested inside a @PROP block - confirmed 2026-08-14 against the real
//    example in MOARdV/Scripts/MAS_Scripts.cfg. Nesting it (as this file
//    originally did) means MAS's loader never finds it: the function
//    silently never exists, and calling it throws "attempt to call a nil
//    value" - not a bug in the Lua logic itself, a declaration-placement
//    bug.
MAS_LUA
{
	name = MFDExt_Scripts
	script = MFDExtension/Scripts/MFDExt.lua
}

// 1. Register our pages with the host monitor. MASMonitor takes an explicit
//    `page =` list; a MAS_PAGE that isn't listed here is never reachable.
//    Each bay placeholder (and MFDExt_ILS) is really TWO mutually-exclusive
//    MAS_PAGE declarations sharing one name (NEEDS[X] / NEEDS[!X], see
//    Pages/MFDExt_SA.cfg and siblings) - only one ever loads, so listing
//    the shared name here once is correct either way.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_Stby
		page = MFDExt_SA_Placeholder
		page = MFDExt_BATT_Placeholder
		page = MFDExt_KRAB_Placeholder
		page = MFDExt_KRILL_Placeholder
		page = MFDExt_ILS
	}
}

// 2. Softkeys 7 (R9/NEXT) and 8 (R10/PREV), from the host's own standby
//    page, BOTH jump to our hub - symmetric, either one works. Softkeys are
//    per-page in MAS, so no other page's use of R9/R10 is touched. Verified
//    free here: MAS_JSI_BasicMFD_Home defines only softkeys 9, 12 and 17.
@MAS_PAGE[MAS_JSI_BasicMFD_Home]:NEEDS[AvionicsSystems]:FINAL
{
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_Stby")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_Stby")
}

// 3. Buttons B/C/E and STBY are NOT per-page softkeys - each is wired once,
//    prop-wide, on MASComponent, straight to a fixed page via onClick
//    (verified on the real source for every one of them, 2026-08-09/14).
//    "?" is MM's single-character wildcard, standing in for the literal
//    space in each collider's `name =` field (a raw space in a `[...]`
//    selector fails to load - confirmed in game 2026-08-14).
//
//    B: incidentally fixes an upstream typo in the host's own file (see
//       Scripts/MFDExt.lua for detail - not our bug, but our override
//       supplies the correct target either way).
//    C: KRAB bay.
//    E: repurposed for NavInstruments/ILS (see Pages/MFDExt_ILS.cfg) -
//       native VesselView target preserved outside our world.
//    STBY: needs its own logic (go up one level, not straight to host) -
//       see MFDExt_ButtonSTBY in Scripts/MFDExt.lua.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems]:FINAL
{
	@MODULE[MASComponent]
	{
		@COLLIDER_EVENT[B?button]
		{
			@onClick = MFDExt_ButtonB("%AUTOID%")
		}
		@COLLIDER_EVENT[C?button]
		{
			@onClick = MFDExt_ButtonC("%AUTOID%")
		}
		@COLLIDER_EVENT[E?button]
		{
			@onClick = MFDExt_ButtonE("%AUTOID%")
		}
		@COLLIDER_EVENT[STBY?button]
		{
			@onClick = MFDExt_ButtonSTBY("%AUTOID%")
		}
	}
}

// 4. NavInstruments' own KSF_MLS handler (see Pages/MFDExt_ILS.cfg) needs
//    manual instantiation as a sibling MODULE on this prop - MAS's
//    RPM_MODULE bridge does not auto-instantiate the way RPM itself does
//    for PAGEHANDLER/BACKGROUNDHANDLER (confirmed on the MAS wiki,
//    "MASMonitor" page: "you must manually add the RPM module's
//    configuration to the prop itself"). Field values mirror
//    NavInstruments' own RPM patch (NavInstruments/MFD/addToRPM018.cfg)
//    for the same handler. LEAST VERIFIED block in this file.
@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&NavInstruments]:FINAL
{
	MODULE
	{
		name = KSF_MLS
		btnPrevRwy = 6
		btnNextRwy = 5
		btnDefaultRwyGS = 3
	}
}
